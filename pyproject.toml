[project]
name = "django-tailwind-daisyui-template"
version = "0.1.0"
description = "A Django starter with Tailwind CSS and daisyUI."
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2,<5.3",
    "django-tailwind>=4.5,<5",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21,<2",
    "playwright>=1.58,<2",
]

[tool.uv]
package = false
